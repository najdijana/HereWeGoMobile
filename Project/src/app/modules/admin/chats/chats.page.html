<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>chats</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-toolbar>
    <ion-title size="large">chats</ion-title>
  </ion-toolbar>
  
  
  <ion-list *ngIf="chatRooms as rooms" >
    <ion-list-header class="ion-padding-bottom">
      RECENT CHATS
    </ion-list-header>
    <ion-item *ngFor="let item of rooms" (click)="getChat(item)" [detail]="true">
      <ng-container *ngIf="item">
        <ion-avatar slot="start">
          <img [src]="item.profilePicture" />
        </ion-avatar>
        <ion-label>
          {{ item.displayName }}
          <p>
            <ion-text>
              message
            </ion-text>
          </p>
        </ion-label>
      </ng-container>
    </ion-item>
  </ion-list>
  

  <ion-fab slot="fixed" horizontal="end" vertical="bottom">
    <ion-fab-button (click)="newChat()">
      <ion-icon name="add">
      </ion-icon>
    </ion-fab-button>

  </ion-fab>


  <ion-modal #new_chat [isOpen]="open_new_chat" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title> New Chat </ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cancel()"> Cancel </ion-button>
          </ion-buttons>
        </ion-toolbar>
        <ion-toolbar>
          <ion-searchbar [(ngModel)]="searchQuery" (ionInput)="filterUsers()"></ion-searchbar>
        </ion-toolbar>
      </ion-header>
      <ion-content color="light">
        <ng-container *ngIf="searchQuery; else allUsersList">
          <ion-list class="ion-margin-top" [style.background]="'transparent'" lines="none">
            <app-user-list *ngFor="let item of filteredUsers" [item]="item" (onClick)="startChat($event)">
            </app-user-list>
          </ion-list>
        </ng-container>
        <ng-template #allUsersList>
          <ion-list class="ion-margin-top" [style.background]="'transparent'" lines="none">
            <app-user-list *ngFor="let item of users" [item]="item" (onClick)="startChat($event)">
            </app-user-list>
          </ion-list>
        </ng-template>
      </ion-content>
    </ng-template>
  </ion-modal>
  

</ion-content>
