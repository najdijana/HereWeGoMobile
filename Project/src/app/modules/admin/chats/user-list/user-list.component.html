<ion-item
line="full"
(click)="redirect()"
detail="true">
<ion-avatar slot="start">
<img [src]="item?.profilePicture?? '../../../../../assets/img/avatar.jpg'" />
</ion-avatar>
<ion-label>
  <ng-container *ngIf="item?.firstName && item?.lastName; else displayName">
    {{item.firstName}} {{item.lastName}}
  </ng-container>
  <ng-template #displayName>
    {{item?.displayName}}
  </ng-template>
</ion-label>
</ion-item>
