<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
       <ion-icon name="chevron-back-outline"></ion-icon>Back      </ion-button>
    </ion-buttons>  
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Guider Profile Section -->
  <ng-container *ngIf="guiders | async as guider">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <!-- Profile Image -->
          <ion-avatar slot="start">
            <img [src]="guider.user.profilePicture" alt="Profile Image" />
          </ion-avatar>
          <!-- Centered Texts Beside the Image -->
          <ion-label>
            <h2>{{ guider.user.displayName }}</h2>
            <p>{{ guider.user.email }}</p>
            <!--   <p>Member since {{ guider.user.createdDate | date: 'MMMM yyyy' }}</p>-->
          </ion-label>
        </ion-item>
        <!-- Verifications Section -->
        <ion-grid>
          <ion-row>
            <ion-col size="auto">
              <ion-icon name="call" color="primary"></ion-icon>
              <ion-label>{{ guider.user.phone }}</ion-label>
            </ion-col>
            <ion-col size="auto">
              <ion-icon name="mail" color="primary"></ion-icon>
              <ion-label>{{ guider.user.email }}</ion-label>
            </ion-col>
            <ion-col size="auto">
              <ion-icon name="document" color="primary"></ion-icon>
              <ion-label (click)="open(guider.user.guiderCertificateURL)" style="cursor: pointer;">Travel
                Certificate</ion-label>
            </ion-col>
            <ion-col size="auto">
              <ion-icon name="globe" color="primary"></ion-icon>
              <ion-label (click)="open(guider.user.instaUrl)" style="cursor: pointer;">Social
                Media</ion-label>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <!-- Activity Section -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Activity</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <!-- Card for each package -->
          <ng-container *ngIf="packages | async as packages">
            <ion-col size="12" size-sm="6" *ngFor="let package of packages">
              <ion-card>
                <img [src]="package.image || 'https://via.placeholder.com/400x200'" alt="{{ package.packageName }}" />
                <ion-card-content>
                  <ion-card-title>{{ package.packageName }}</ion-card-title>
                  <ion-text>{{ package.place }}</ion-text>
                  <ion-text>
                    <ion-icon name="star" color="warning"></ion-icon>
                    <ion-icon name="star" color="warning"></ion-icon>
                    <ion-icon name="star" color="warning"></ion-icon>
                    <ion-icon name="star" color="warning"></ion-icon>
                    <ion-icon name="star-half" color="warning"></ion-icon>
                    ({{ package.nbreviews }} Reviews)
                  </ion-text>
                  <ion-grid>
                    <ion-row>
                      <ion-col>{{ package.days }} days</ion-col>
                      <ion-col>${{ package.budget }}</ion-col>
                    </ion-row>
                  </ion-grid>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ng-container>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
