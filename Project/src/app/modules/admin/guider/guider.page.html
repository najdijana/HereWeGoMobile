<ion-header>
  <ion-toolbar>
    <ion-title>Travel Guide</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container-xxl py-5">
    <div class="container">
      <div class="text-center">
        <h6 class="section-title bg-white text-center text-primary px-3">Travel Guide</h6>
        <h1 class="mb-5 text-primary">Meet Our Guide</h1>
      </div>

      <ng-container *ngIf="guiders$ | async as guiders">
        <ion-grid>
          <ion-row>
            <ion-col size="12" size-md="6" size-lg="3" *ngFor="let guider of guiders">
              <ion-card [routerLink]="['/guider', guider.user.uid, 'details']">
                <ion-card-content>
                  <ion-item lines="none">
                    <ion-avatar slot="start">
                      <img [src]="guider.user.profilePicture" alt="{{ guider.user.displayName }}">
                    </ion-avatar>
                    <ion-label>
                      <h2>{{ guider.user.displayName }}</h2>
                      <p>{{ guider.user.email }}</p>
                    </ion-label>
                  </ion-item>
                  <ion-item lines="none">
                    <ion-label position="fixed">Phone</ion-label>
                    <ion-label>{{ guider.user.phone }}</ion-label>
                  </ion-item>
                  <ion-item lines="none">
                    <ion-label position="fixed">Email</ion-label>
                    <ion-label>{{ guider.user.email }}</ion-label>
                  </ion-item>
                  <ion-item lines="none">
                    <ion-label position="fixed">Social Media</ion-label>
                    <ion-buttons slot="end">
                      <ion-button *ngIf="guider.user.instaUrl" href="{{ guider.user.instaUrl }}" target="_blank">
                        <ion-icon slot="icon-only" name="logo-instagram"></ion-icon>
                      </ion-button>
                      <!-- Add other social media links similarly -->
                    </ion-buttons>
                  </ion-item>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ng-container>
    </div>
  </div>
</ion-content>
