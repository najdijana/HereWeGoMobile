<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>sign-in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-text-center">
    <img src="../../../../assets/img/logoNav.png" alt="Logo">
  </div>

  <h2 class="ion-text-center ion-margin-top ion-text-bold">
    Sign in
  </h2>

  <form #signInForm="ngForm" (ngSubmit)="login()">
    <ion-item lines="full">
      <ion-label position="floating">E-Mail</ion-label>
      <ion-input [(ngModel)]="signInData.email" name="email" required></ion-input>
    </ion-item>


    <ion-item lines="full">
      <ion-label position="floating">Password</ion-label>
      <ion-input type="{{showPassword ? 'text' : 'password'}}"  name="password" required></ion-input>
      <ion-icon slot="end" name="{{showPassword ? 'eye-off' : 'eye'}}" (click)="togglePasswordVisibility()"></ion-icon>
    </ion-item>


    <ion-button expand="block" type="submit" [disabled]="!signInForm.valid">
      <ion-label>Sign In</ion-label>
      <ion-spinner *ngIf="signingIn" name="dots" color="primary" slot="end"></ion-spinner>
    </ion-button>
  </form>

  <p class="ion-text-center ion-padding-top">
    Don't have an account? <a routerLink="/sign-up">Sign up</a>
  </p>

  <ion-segment class="ion-padding">
    <ion-segment-button (click)="registerWithGoogle()" >
      <ion-icon color="primary" name="logo-google"></ion-icon>
      <ion-label>Google</ion-label>
    </ion-segment-button>
  
    <ion-segment-button (click)="registerWithFacebook()">
      <ion-icon color="primary" name="logo-facebook"></ion-icon>
      <ion-label>Facebook</ion-label>
    </ion-segment-button>
  </ion-segment>

</ion-content>
