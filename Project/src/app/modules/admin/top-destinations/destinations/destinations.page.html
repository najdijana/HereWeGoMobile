<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>destinations</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">destinations</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let destination of TopDest | async" class="max-w-sm mx-3 bg-white rounded-3xl shadow-md overflow-hidden ">
    <div class="relative">
      <img [src]="destination.Image" alt="{{ destination.Name }}" class="w-full h-56 object-cover">
      <ion-icon name="heart" class="absolute top-4 right-4 text-white text-3xl"></ion-icon>
    </div>
    <div class="p-4">
      <!-- <div class="flex items-center">
        <img src="../../../../../assets/img/avatar.jpg" alt="Guide" class="h-6 w-6 rounded-full">
        <p class="ml-2 text-sm text-gray-600">Guided by {{ destination.Governate }}</p>
      </div> -->
      <h2 class="mt-2 text-lg font-semibold text-gray-900">{{ destination.Activity }}</h2>
      <p class="text-sm text-gray-500">
        <ion-icon name="location-outline" class="text-base align-middle mr-1"></ion-icon>
        {{ destination.City }}
      </p>
            <div class="flex justify-between items-center mt-2">
        <span class="text-lg font-bold text-gray-900">${{ destination.Price }}</span>
      </div>
    </div>
  </ion-card>
</ion-content>
